<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="" href="main.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="main.js" defer></script>
    <title>EZPythag</title>
</head>
<body>
    <h1 class="centered" style="font-size: 70px; outline-color: invert; -webkit-text-stroke: 10px white; paint-order: stroke fill;">EZPythag</h1>
    <h5 class="centered" style="font-style: italic;">this website was made for fun to test my web dev skills!</h2>

    <br><br>
    <label for="stype" class="centered">What side?</label><br>

    <div class="center-container">
        <select name="type" id="stype" style="font-size: 20px;" class="centered">
            <option value="y">Hypotomuse</option>
            <option value="n">Short-Side</option>
        </select>
    </div>
    <br><br> <!-- Idk how to do spacing so i just spam breaks :heart:-->
    <p style="font-size: 20px;" class="centered">Side 1</p>
    <input id="side1" class="center-container" style="text-align: center;" type="number">
    <br>
    <p style="font-size: 20px;" class="centered">Side 2</p>
    <input id="side2" class="center-container" style="text-align: center;" type="number">
    <br><br>

    <div id="workingOut">
        <h2 class="center-container">Working Out</h2>
        <p id="l1" class="center-container">x = N/A + N/A</p>
        <p id="l2" class="center-container">x = N/A</p>
        <p id="l3" class="center-container">x = sqrt(N/A)</p>
        <p id="l4" class="center-container">x = N/A</p>
    </div>

    <br><br>
    <p>Other links :p</p>
    <a href="/pythag/checker">Right Angle Triangle Checker</a>

    
</body>
</html>
